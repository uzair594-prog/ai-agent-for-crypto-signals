name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma generation/build must not require a real production secret.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      AUTH_SECRET: ci-only-not-for-production-secret-value
      TOKEN_ENCRYPTION_KEY: Y2ktb25seS1rZXktbXVzdC1iZS0zMi1ieXRlcy1sb25nIQ==
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
